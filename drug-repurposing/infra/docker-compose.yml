services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DR_DATA_DIR: /data
    volumes:
      - ../data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    ports:
      - "8080:80"
